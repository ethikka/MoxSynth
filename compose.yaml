# MoxSynth on a home server / NAS:
#
#   1. Put AllPrintings.sqlite.zip (mtgjson.com → All Files) in ./data – copy the rest of an existing
#      src/MoxSynth/App_Data along with it to keep profiles, collections, prices and sign-ins.
#   2. docker compose up -d --build
#   3. Open http://<server>:5180  (Android app: server address <server>:5180, default moxsynth:5180)
#
# Settings can be overridden in a .env file next to this one (see README → "Running in Docker").
services:
  moxsynth:
    build: .
    image: moxsynth:latest
    container_name: moxsynth
    restart: unless-stopped
    ports:
      - "${MOXSYNTH_PORT:-5180}:8080"
    # Runs as this user id so it can write ./data (use the owner of ./data: `id -u` / `id -g`).
    user: "${PUID:-1654}:${PGID:-1654}"
    environment:
      TZ: ${TZ:-Europe/Amsterdam}   # dates in notes and lists are shown in this time zone
      # Optional overrides of appsettings.json, e.g. which shops' prices to import:
      # Prices__Providers__0: cardmarket
      # Prices__Providers__1: tcgplayer
    volumes:
      - ./data:/app/App_Data
